[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulseguard-analytics"
version = "0.1.0"
description = "PulseGuard nightly analytics batch job: bronze Delta reads, gold aggregates, PSI drift, data quality gates"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["pulseguard_analytics*"]
