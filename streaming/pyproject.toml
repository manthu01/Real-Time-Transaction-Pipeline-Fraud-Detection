[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulseguard-streaming"
version = "0.1.0"
description = "PulseGuard Spark Structured Streaming feature computation job"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["pulseguard_streaming*"]
