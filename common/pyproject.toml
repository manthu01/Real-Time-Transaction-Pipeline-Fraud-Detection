[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulseguard-common"
version = "0.1.0"
description = "Shared static reference data (cities, geo distance) used by both the generator and the streaming feature job"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["pulseguard_common*"]
