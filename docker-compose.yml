name: pulseguard

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: pulseguard-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: pulseguard-kraft-cluster
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-topics-init:
    image: apache/kafka:3.8.0
    container_name: pulseguard-kafka-topics-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka/create_topics.sh:/create_topics.sh
    entrypoint: ["/bin/bash", "/create_topics.sh", "kafka:19092"]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: pulseguard-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pulseguard
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: pulseguard-redis
    ports:
      - "6380:6379"
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: pulseguard-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: pulseguard
      POSTGRES_PASSWORD: pulseguard
      POSTGRES_DB: pulseguard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  spark-feature-job:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    container_name: pulseguard-spark-feature-job
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
    volumes:
      - spark_checkpoints:/opt/pulseguard/checkpoints
      - spark_ivy_cache:/root/.ivy2
      # trained model artifacts are a host-side, gitignored build output
      # (see detection/README) -- bind-mounted read-only rather than baked
      # into the image, so retraining a new "champion" doesn't require a
      # rebuild, matching the build plan's "evaluate, don't auto-promote"
      # stance on retraining.
      - ./detection/artifacts:/opt/pulseguard/detection-artifacts:ro
    command:
      - /opt/spark/bin/spark-submit
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.4.0
      - --master
      - local[2]
      - pulseguard_streaming/feature_job.py
      - --bootstrap-servers
      - kafka:19092
      - --redis-host
      - redis
      - --redis-port
      - "6379"
      - --checkpoint-dir
      - /opt/pulseguard/checkpoints
      - --starting-offsets
      - earliest
      - --trigger-interval
      - 5 seconds
      - --alerts-topic
      - fraud.alerts
      - --detection-artifacts-dir
      - /opt/pulseguard/detection-artifacts

volumes:
  kafka_data:
  redis_data:
  postgres_data:
  spark_checkpoints:
  spark_ivy_cache:
